<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Jogoborg - Borg Backup Manager" />
  <meta name="theme-color" content="#1976d2" />
  <title>Jogoborg</title>
  <script>
    // Public base URL. JOGOBORG_URL_PLACEHOLDER is replaced by the container
    // entrypoint at start time; fall back to the current origin otherwise
    // (covers the local dev server and direct local access).
    var JOGOBORG_URL_VALUE = "JOGOBORG_URL_PLACEHOLDER";
    window.JOGOBORG_URL = (JOGOBORG_URL_VALUE !== "JOGOBORG_URL_PLACEHOLDER")
      ? JOGOBORG_URL_VALUE
      : window.location.origin;
  </script>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
